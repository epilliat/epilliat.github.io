project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.md"
    - "!research/presentations/sandbox/"
    # Internal notes — never publish (they are gitignored at the source, but the
    # "*.md" glob above would otherwise render them into docs/ and publish them).
    - "!**/CLAUDE.md"
    - "!**/REVIEW_PLAN.md"
    # Spoken lecture scripts — same reasoning: gitignored at the source, but the
    # "*.md" glob would otherwise render them into docs/ and publish them.
    - "!**/speaker_notes/"
    # Presenter copies: rendered on demand, never as part of the site build
    # (they would land in docs/ and leak the notes into the search index).
    - "!**/speaker_view/"

website:
  title: "Emmanuel Pilliat"
  navbar:
    background: dark
    left:
      - text: "Research"
        href: research.qmd
      - text: "Teaching"
        href: teaching/teaching.qmd
      - text: "Software"
        href: software/software.qmd
      - text: "CV"
        href: cv.qmd
    right:
      - icon: github
        href: https://github.com/epilliat
      - icon: linkedin
        href: https://fr.linkedin.com/in/emmanuel-pilliat-18ab2b180
      - icon: envelope
        href: mailto:emmanuel.pilliat@ensai.fr

format:
  html:
    theme:
      - darkly
      - theme-aurora.scss
    css: styles.css
    toc: true
