format:
  revealjs:
    history: false
    include-after-body:
      text: |
        <script>
        // Alt+Left = browser Back (Reveal otherwise binds Alt+arrow to slide nav)
        window.addEventListener('keydown', function (e) {
          if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'ArrowLeft' || e.keyCode === 37)) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (history.length > 1) history.back();
          }
        }, true);
        // Title-slide notice: the course is still a draft
        var ts = document.getElementById('title-slide');
        if (ts) {
          var p = document.createElement('p');
          p.textContent = '🚧 Draft — course under construction';
          p.style.cssText = 'color:#c07a00;font-size:0.6em;font-weight:600;margin-top:1.2em';
          ts.appendChild(p);
        }
        </script>
