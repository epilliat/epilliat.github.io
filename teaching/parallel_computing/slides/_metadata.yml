format:
  revealjs:
    history: false
    # MathJax 2 typesets every slide at load, while reveal keeps all but the nearest
    # ones display:none. HTML-CSS output then measures widths wrong, and CommonHTML's
    # matchFontHeight measures the text height as 0 (equations at 50%), until F5.
    # CommonHTML without matchFontHeight sizes math in em only; scale 109 = the size
    # matchFontHeight gave on visible slides.
    include-in-header:
      text: |
        <script type="text/x-mathjax-config">MathJax.Hub.Config({menuSettings: {renderer: "CommonHTML"}, CommonHTML: {matchFontHeight: false, scale: 109}});</script>
    include-after-body:
      text: |
        <script>
        // Alt+Left = browser Back (Reveal otherwise binds Alt+arrow to slide nav)
        window.addEventListener('keydown', function (e) {
          if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'ArrowLeft' || e.keyCode === 37)) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (history.length > 1) history.back();
          }
        }, true);
        // Title-slide notice: the course is still a draft
        var ts = document.getElementById('title-slide');
        if (ts) {
          var p = document.createElement('p');
          p.textContent = '🚧 Draft — course under construction';
          p.style.cssText = 'color:#c07a00;font-size:0.6em;font-weight:600;margin-top:1.2em';
          ts.appendChild(p);
        }
        </script>
